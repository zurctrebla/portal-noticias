astcgi_script_name;\n        include fastcgi_params;\n        fastcgi_read_timeout 300;\n        fastcgi_buffer_size 16k;\n        fastcgi_buffers 4 16k;\n\n        # FastCGI Cache\n        fastcgi_cache wordpress;\n        fastcgi_cache_valid 200 10m;\n        fastcgi_cache_bypass $skip_cache;\n        fastcgi_no_cache $skip_cache;\n\n        # Ignorar Set-Cookie do plugin GDPR para não impedir cache\n        fastcgi_ignore_headers Set-Cookie;\n\n        # A resposta agora depende do User-Agent; declarar isso evita que\n        # qualquer cache intermediario repita o problema que acabamos de corrigir.\n        add_header Vary \"User-Agent\";\n        add_header Cache-Control $bahia_cache_control;\n\n        add_header X-FastCGI-Cache $upstream_cache_status;\n        # Diagnostico: 00 desktop, 10 celular, 11 iPad. Conferir com\n        #   curl -sI https://bahia.ba/ -H 'User-Agent: ...' | grep -i x-bahia-device\n        add_header X-Bahia-Device \"$bahia_mobile$bahia_ipad\";\n    }\n\n    location ~* \\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {\n        expires 7d;\n        add_header Cache-Control \"public, no-transform\";\n    }\n\n    location = /favicon.ico { log_not_found off; access_log off; }\n    location = /robots.txt  { log_not_found off; access_log off; }\n\n    location ~ /\\. { deny all; }\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"nginx-config","namespace":"bahia-wordpress"}}
