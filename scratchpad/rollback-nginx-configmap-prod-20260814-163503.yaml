apiVersion: v1
data:
  default.conf: |
    # Cache FastCGI
    fastcgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=wordpress:100m inactive=60m max_size=1g;

    # ------------------------------------------------------------------------
    # Dimensao de dispositivo na chave do cache
    #
    # O tema decide o HTML no servidor, nao no CSS: themes/bahia_refactor/header.php:98
    # faz "if (is_mobile())" e emite markup completamente diferente para celular e
    # desktop -- sao 15 templates com esse par -web.php / -mobile.php. Como a chave
    # tinha so a URL, a mesma entrada guardava UMA variante e quem preenchesse o cache
    # primeiro ditava o layout de todo mundo pelos 10 min de fastcgi_cache_valid.
    # Era isso que fazia ~37% dos acessos desktop receberem o HTML de celular
    # (medido em 12/08/2026; regressao introduzida junto com o cache em 146787f).
    #
    # O regex abaixo e um SUBCONJUNTO das regras da propria Mobile-Detect 2.8.41 que o
    # tema carrega em themes/bahia_refactor/Mobile-Detect/Mobile_Detect.php, montado a
    # partir de getMobileDetectionRules(). Ser subconjunto e o que da a garantia que
    # importa: o nginx nunca classifica como mobile algo que o PHP considera desktop.
    # A cobertura no sentido inverso foi medida contra 33.660 requisicoes reais de prod
    # (1.721 User-Agents distintos), com zero divergencia. As regras completas custam
    # 26 KB e 4,3 ms por requisicao sem PCRE JIT; este recorte custa 3 us.
    # Se a Mobile-Detect for atualizada, remedir antes de confiar.
    #
    # ATENCAO na migracao para o Newspaper: o td-composer chama a MESMA isMobile()
    # (plugins/td-composer/legacy/Newspaper/header.php:20), mas por OUTRA copia da
    # biblioteca -- plugins/td-composer/includes/Mobile_Detect.php e a 2.8.34, com 179
    # regras: 4 a menos e 14 com o mesmo nome e regex diferente, entre elas Chrome,
    # Safari, Firefox e Edge. Quando o bahia_refactor sair de cena, a 2.8.34 passa a
    # valer e vira a fonte deste regex. Divergencia medida entre as duas contra as
    # mesmas 33.660 requisicoes: 1 requisicao, um UA que diz macOS e CriOS/145 junto.
    # Procedimento para regenerar na secao 8 de
    # wp-content/scratchpad/MIGRACAO-homolog-para-prod.md.
    map $http_user_agent $bahia_mobile {
        default 0;
        "~*Android|\biPhone\b|\biPod\b|iPad|iPad.*Mobile|bolt|BREW|J2ME/|\bMIDP\b|\bCLDC\b|PalmSource|Palm|IEMobile|MSIEMobile|Version((?!\bEdgiOS\b).)*Mobile.*Safari|Safari.*Mobile|MobileSafari|Symbian|SymbOS|Series60|Series40|SYB-[0-9]+|\bS60\b|BlackBerry|\bBB10\b|rim[0-9]+|\b(BBA100|BBB100|BBD100|BBE100|BBF100|STH100)\b-[0-9]+|PlayBook|RIM Tablet|Windows Phone 10.0|Windows Phone 8.1|Windows Phone 8.0|Windows Phone OS|XBLWP7|ZuneWP7|Windows NT 6.[23]; ARM;|Windows CE.*(PPC|Smartphone|Mobile|[0-9]{3}x[0-9]{3})|Windows Mobile|Windows Phone [0-9.]+|WCE;|webOS|hpwOS|\bBada\b|MeeGo|PalmOS|avantgo|blazer|elaine|hiptop|palm|plucker|xiino|Kindle|Silk.*Accelerated|Android.*\b(KFOT|KFTT|KFJWI|KFJWA|KFOTE|KFSOWI|KFTHWI|KFTHWA|KFAPWI|KFAPWA|WFJWAE|KFSAWA|KFSAWI|KFASWI|KFARWI|KFFOWI|KFGIWI|KFMEWI)\b|Android.*Silk/[0-9.]+ like Chrome/[0-9.]+ (?!Mobile)|Android.*Nexus[\s]+(7|9|10)|Tapatalk|PDA;|SAGEM|\bmmp\b|pocket|\bpsp\b|symbian|Smartphone|smartfon|treo|up.browser|up.link|vodafone|\bwap\b|nokia|Series40|Series60|S60|SonyEricsson|N900|MAUI.*WAP.*Browser|NokiaBrowser|OviBrowser|OneBrowser|TwonkyBeamBrowser|SEMC.*Browser|FlyFlow|Minimo|NetFront|Novarra-Vision|MQQBrowser|MicroMessenger|UC.*Browser|UCWEB|Opera.*Mini|Opera.*Mobi|Android.*Opera|Mobile.*OPR/[0-9.]+$|Coast/[0-9.]+|\bDolfin\b|Skyfire|fennec|firefox.*maemo|(Mobile|Tablet).*Firefox|Firefox.*Mobile|FxiOS.*Mobile|EdgiOS.*Mobile|Mobile Safari/[.0-9]* Edge|\bCrMo\b|CriOS.*Mobile|Android.*Chrome/[.0-9]* Mobile|Lumia [0-9]{3,4}" 1;
    }

    # Alem de is_mobile(), varios templates ainda ramificam em
    # strpos(getUserAgent(), "iPad") -- header.php:182, single_web.php:32,
    # search-web.php:36, archive-municipios-web.php:8, entre outros. Esse strpos e
    # sensivel a maiuscula, por isso o "~" sem asterisco.
    map $http_user_agent $bahia_ipad {
        default 0;
        "~iPad" 1;
    }

    fastcgi_cache_key "$scheme$request_method$host$request_uri|d=$bahia_mobile$bahia_ipad";

    # "updating" serve a copia vencida enquanto UMA requisicao regenera; o cache_lock
    # impede que N requisicoes simultaneas da mesma URL batam no PHP juntas. Os dois
    # pesam mais a partir de agora: a chave nova invalida 100% das entradas, e como
    # /tmp/nginx-cache e emptyDir, todo restart de pod ja parte de cache frio.
    fastcgi_cache_use_stale error timeout invalid_header updating http_500;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 8s;

    # Cache-Control so para o que e cacheavel de fato ($skip_cache = 0). Em wp-admin,
    # login e usuario logado o valor fica vazio e o nginx nao emite o cabecalho, entao
    # os headers do proprio WordPress passam sem duplicar. Sem isso a resposta nao tem
    # Cache-Control nem Vary nem ETag nem Last-Modified, e o navegador guarda o HTML
    # por heuristica -- foi o que fez o layout errado sobreviver no cliente e passar a
    # impressao de que a causa era o cache do navegador.
    map $skip_cache $bahia_cache_control {
        "0"     "public, max-age=60, must-revalidate";
        default "";
    }

    # Rate limiting usando IP real (X-Forwarded-For via ALB)
    map $http_x_forwarded_for $real_ip {
        ~^(\d+\.\d+\.\d+\.\d+) $1;
        default $remote_addr;
    }
    limit_req_zone $real_ip zone=login:10m rate=20r/m;
    limit_req_zone $real_ip zone=xmlrpc:10m rate=5r/m;

    # Bloqueio de bots por User-Agent
    map $http_user_agent $bad_bot {
        default 0;
        ~*AhrefsBot 1;
        ~*SemrushBot 1;
        ~*MJ12bot 1;
        ~*DotBot 1;
        ~*BLEXBot 1;
        ~*DataForSeoBot 1;
        ~*PetalBot 1;
        ~*serpstatbot 1;
        ~*SEOkicks 1;
        ~*linkdexbot 1;
        ~*Barkrowler 1;
        ~*ZoominfoBot 1;
        ~*Bytespider 1;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        client_max_body_size 128M;

        # Bloquear bots agressivos
        if ($bad_bot = 1) {
            return 403;
        }

        # FastCGI Cache — bypass para admin/login/usuários logados
        set $skip_cache 0;

        if ($request_method = POST) { set $skip_cache 1; }
        if ($query_string != "") { set $skip_cache 1; }
        if ($request_uri ~* "/wp-admin/|/wp-login.php|/xmlrpc.php|/feed/") { set $skip_cache 1; }
        if ($http_cookie ~* "comment_author|wordpress_logged_in|wp-postpass") { set $skip_cache 1; }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Bloquear xmlrpc.php com rate limit
        location = /xmlrpc.php {
            limit_req zone=xmlrpc burst=2 nodelay;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Rate limit no wp-login
        location = /wp-login.php {
            limit_req zone=login burst=5 nodelay;
            # $args e a query string crua, sem decodificar: a versao url-encoded
            # do mesmo payload (wp-admin%2Fnetwork) escapava da regra anterior,
            # que so olhava a barra literal. O nginx nao tem urldecode nativo para
            # variavel, entao a regex cobre as duas formas -- e tambem o ponto
            # codificado (%2e) no dominio e o duplo encode (%252f).
            # O ~* ja resolve maiuscula/minuscula (%2F e %2f).
            # Nao pega login legitimo: o redirect_to do formulario aponta para
            # wp-admin/ sem "network".
            if ($args ~* "redirect_to.*(aws(\.|%2e)bahia(\.|%2e)ba|wp-admin(/|%2f|%252f)network)") {
                return 403;
            }
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;

            # FastCGI Cache
            fastcgi_cache wordpress;
            fastcgi_cache_valid 200 10m;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;

            # Ignorar Set-Cookie do plugin GDPR para não impedir cache
            fastcgi_ignore_headers Set-Cookie;

            # A resposta agora depende do User-Agent; declarar isso evita que
            # qualquer cache intermediario repita o problema que acabamos de corrigir.
            add_header Vary "User-Agent";
            add_header Cache-Control $bahia_cache_control;

            add_header X-FastCGI-Cache $upstream_cache_status;
            # Diagnostico: 00 desktop, 10 celular, 11 iPad. Conferir com
            #   curl -sI https://bahia.ba/ -H 'User-Agent: ...' | grep -i x-bahia-device
            add_header X-Bahia-Device "$bahia_mobile$bahia_ipad";
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt  { log_not_found off; access_log off; }

        location ~ /\. { deny all; }
    }
kind: ConfigMap
