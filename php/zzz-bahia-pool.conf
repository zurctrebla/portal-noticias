; Pool do PHP-FPM — bahia.ba
;
; Carrega por ultimo (php-fpm.conf faz include=etc/php-fpm.d/*.conf, em ordem
; alfabetica), entao sobrescreve o www.conf da imagem oficial.
;
; POR QUE ISTO EXISTE
;
; O www.conf vinha com pm.max_children = 5, que e o PADRAO do PHP e nunca foi
; ajustado. Cada pod atendia no maximo 5 requisicoes PHP simultaneas — enquanto
; o container tem 2 CPUs e limite de 2 GB, usando cerca de 300 MB.
;
; Quem sentia: os REPORTERES. A config do nginx tira do fastcgi_cache quem tem
; cookie de sessao, entao o visitante anonimo e servido pelo cache e o usuario
; logado vai SEMPRE ao PHP. Com 5 vagas por pod disputadas por rastreadores,
; paginas nao cacheadas e o proprio painel, quem estava logado sentia cada
; saturacao. Relato em 15/08/2026: "sistema cai/fica lento com certa frequencia".
;
; DIMENSIONAMENTO (medido em producao, 15/08/2026)
;
;   RSS por worker ....... ~105 MB (inclui o opcache de 256 MB, que e COMPARTILHADO
;                          entre os workers — o RSS superestima o custo real)
;   limite do container .. 2 GB
;   pior caso com 12 ..... 12 x 105 + master ~= 1,3 GB, deixando ~700 MB de folga
;
; Se um dia precisar subir mais, meça de novo antes: o teto e a memoria do
; container, e passar dele significa OOMKill, nao lentidao.

[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; recicla o worker a cada 500 requisicoes: com mais concorrencia, limita o
; acumulo de memoria de vazamentos lentos em plugins
pm.max_requests = 500
