name: Build e Deploy (homolog)

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 774710032593.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: bahia-wordpress
  EKS_CLUSTER: bahia-eks-homolog
  NAMESPACE: bahia-wordpress

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push imagem
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Sem --build-arg: homolog e producao constroem a partir da MESMA tag,
          # o default `ARG WP_VERSION` do Dockerfile. A separacao acabou em
          # 03/09/2026 -- a condicao de saida esta escrita no topo do Dockerfile.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:homolog-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:homolog-latest

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Imagem antes do deploy (para rollback)
        id: anterior
        run: |
          CURRENT=$(kubectl get deployment/wordpress -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="wordpress")].image}' 2>/dev/null || echo "")
          echo "imagem antes do deploy: ${CURRENT:-(deployment ainda nao existe)}"
          echo "previous_image=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Deploy no EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMG="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # OS DOIS CONTEINERES, na mesma operacao — igual ao deploy-prod.yml.
          #
          # O initContainer copy-wp-files e quem popula /var/www/html no volume
          # compartilhado que o php-fpm e o nginx enxergam: e ELE que entrega o
          # wp-content, porque o emptyDir monta por cima do /var/www/html da
          # imagem. O conteiner `wordpress` entrega o binario do PHP e o core do
          # WordPress.
          #
          # Ate 2026-08-29 este passo atualizava so o `wordpress`. O resultado era
          # que o initContainer ficava na tag flutuante do manifesto e o codigo
          # servido vinha SEMPRE do ultimo build da develop, independentemente do
          # SHA fixado aqui -- e um rollback por SHA voltava o PHP e o core, mas
          # nao o codigo. Estado misto que nunca foi testado.
          kubectl set image deployment/wordpress \
            copy-wp-files="$IMG" \
            wordpress="$IMG" \
            -n ${{ env.NAMESPACE }} || \
          echo "Deployment ainda não existe, será criado pelos manifests"

          kubectl rollout status deployment/wordpress -n ${{ env.NAMESPACE }} --timeout=600s || true

      # NAO HA passo de purga do fastcgi_cache aqui, e a ausencia e DELIBERADA.
      # Nao "corrija" esta divergencia com o deploy-prod.yml.
      #
      # O cache do nginx vive num `emptyDir` (volume `nginx-cache`), que morre com
      # o pod. Homolog tem UMA replica e `maxSurge: 0` / `maxUnavailable: 1`: o pod
      # antigo cai antes de o novo subir, entao nao sobra nenhum pod servindo cache
      # velho. A purga acontece sozinha, e um passo explicito seria codigo que nao
      # faz nada -- pior que ausente, porque engana quem le depois.
      #
      # EM PRODUCAO E DIFERENTE, e por isso la o passo existe: `maxSurge: 1` /
      # `maxUnavailable: 0` mantem os pods antigos no ar ate os novos ficarem
      # prontos, entao o cache antigo continuaria sendo servido pelos pods que
      # ainda nao trocaram. La a purga e necessaria; aqui nao.
      - name: Como reverter
        if: always()
        run: |
          ANTERIOR="${{ steps.anterior.outputs.previous_image }}"
          if [ -n "$ANTERIOR" ]; then
            {
              echo "### Rollback deste deploy"
              echo ''
              echo '```bash'
              echo "kubectl set image deployment/wordpress \\"
              echo "  copy-wp-files=$ANTERIOR \\"
              echo "  wordpress=$ANTERIOR \\"
              echo "  -n ${{ env.NAMESPACE }}"
              echo "kubectl rollout status deployment/wordpress -n ${{ env.NAMESPACE }}"
              echo '```'
              echo ''
              echo "> O manifesto em \`infra-bahiaba/kubernetes/homolog/wordpress/deployment.yaml\`"
              echo "> fixa um SHA proprio. Se este deploy for para valer, atualize o SHA la tambem —"
              echo "> senao o proximo \`kubectl apply\` do tf-apply.yml desfaz este rollback."
            } >> "$GITHUB_STEP_SUMMARY"
          fi